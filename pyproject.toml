[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codejev"
dynamic = ["version"]
description = "Tiny calibrated decision model for security checks: web attacks, prompt injection, phishing URLs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Subham" }]
keywords = ["security", "waf", "sql-injection", "xss", "prompt-injection", "phishing", "calibration", "decision-model", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.45",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
# Only needed to rebuild the data, train, evaluate or run baselines (scripts/ in the repo).
train = ["datasets>=3.0", "scikit-learn", "accelerate", "numpy", "tqdm", "matplotlib"]
# Faster CPU inference: the Decider uses model.int8.onnx / model.onnx when present.
onnx = ["onnxruntime>=1.17"]
# Exporting and quantizing (scripts/onnx_cpu.py) also needs onnx.
export = ["onnxruntime>=1.17", "onnx"]
test = ["pytest>=8"]

[project.scripts]
codejev = "cyberjev.__main__:main"
cyber-jev = "cyberjev.__main__:main"

[project.urls]
Homepage = "https://github.com/shubham10divakar/CyberJev"
Repository = "https://github.com/shubham10divakar/CyberJev"
Issues = "https://github.com/shubham10divakar/CyberJev/issues"
Model = "https://huggingface.co/sdmlai/cyber-jev"

[tool.hatch.version]
path = "cyberjev/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cyberjev"]
# Metadata 2.4 instead of hatchling's newer default: older twine/pip reject 2.5.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
# Keep the source distribution small: no data/, results/ or training runs.
include = ["/cyberjev", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads the real model from Hugging Face (set CYBERJEV_NETWORK_TESTS=1)"]
